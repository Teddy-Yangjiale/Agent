[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.2.0"
description = "Agent Harness - 模仿 LangChain Agent 实现的通用 Agent 框架，集成 MCP 协议"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "openai>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "typer>=0.9",
    "rich>=13.0",
    "tenacity>=8.0",
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
full = [
    "anthropic>=0.30",
    "google-genai>=1.0",
    "chromadb>=0.5",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.0",
]

[project.scripts]
agent-harness = "agent_harness.cli.main:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
